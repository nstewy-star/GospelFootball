# Builds the local play download (Mac and Windows zips) and publishes it on the Releases page.
# Runs when a tag like local-1.0 is pushed, or by hand from the Actions tab.
name: Local play download
on:
  push:
    tags: ["local-*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and package
        run: |
          cd local && npm ci
          npx @yao-pkg/pkg . --targets node22-macos-arm64,node22-macos-x64,node22-win-x64 --out-path ../dist/bin
          ls -la ../dist/bin
      - name: Sign the Mac programs (ad-hoc, so Apple Silicon will run them)
        run: |
          curl -sSL -o rc.tar.gz "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz"
          tar xzf rc.tar.gz
          for f in dist/bin/gospel-football-macos-*; do ./apple-codesign-0.29.0-x86_64-unknown-linux-musl/rcodesign sign --binary-identifier com.gospelfootball.local "$f"; done
      - name: Assemble the zips
        run: bash local/build-zips.sh dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"; case "$TAG" in local-*) ;; *) TAG="local-manual-${GITHUB_RUN_NUMBER}";; esac
          gh release create "$TAG" dist/GospelFootball-local-mac.zip dist/GospelFootball-local-windows.zip \
            --title "Gospel Football local play ($TAG)" \
            --notes "Runs the game from one laptop for a room with no internet. Unzip, double-click the Start file for your system, and the game opens in the browser at an address on your wifi; phones scan the code on the big screen. The README inside covers the prompts macOS and Windows show the first time. Built from ${GITHUB_SHA}." \
            || gh release upload "$TAG" dist/GospelFootball-local-mac.zip dist/GospelFootball-local-windows.zip --clobber
