<style>
:root { --night:#0c1a1c; --panel:#142a2d; --panel-2:#1b373a; --line:#2a4a4d; --chalk:#f2efe4; --muted:#a9bdb8; --gold:#e9b949; --flag:#f4d21f; --home:#e2603f; --home-2:#b8482c; --away:#4fa6e0; --away-2:#2f7fb8; --good:#57c27a; --bad:#e5604f;
  --f-display:"Graduate","Rockwell","Georgia",serif; --f-ui:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif; --f-read:"Source Serif 4",Georgia,"Times New Roman",serif; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--night); color: var(--chalk); }
body { font-family: var(--f-ui); font-size: 18px; line-height: 1.35; min-height: 100vh; }
button { font-family: var(--f-ui); font-size: 18px; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; letter-spacing: .02em; }
.wrap { max-width: 540px; margin: 0 auto; padding: 12px 16px 40px; display: flex; flex-direction: column; gap: 14px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-size: 22px; } .brand h1 span { color: var(--gold); }
.status { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.status::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--bad); flex: none; }
.status.on::before { background: var(--good); }
.card { background: var(--panel); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.eyebrow { font-weight: 600; text-transform: uppercase; letter-spacing: .14em; font-size: 13px; color: var(--muted); }
.btn { background: var(--gold); color: #1d1606; border: 0; border-radius: 999px; padding: 14px 22px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; box-shadow: 0 4px 0 #a8801f; font-size: 20px; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #a8801f; }
.btn.ghost { background: var(--panel-2); color: var(--chalk); box-shadow: 0 4px 0 #0e1f21; font-size: 17px; padding: 10px 18px; }
.btn.big { font-size: 34px; padding: 26px; font-family: var(--f-display); text-transform: none; letter-spacing: .06em; }
.btn[disabled] { opacity: .6; cursor: default; }
input[type=text] { font-family: var(--f-ui); font-size: 20px; background: var(--panel-2); color: var(--chalk); border: 0; border-radius: 12px; padding: 12px 14px; width: 100%; }
label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 14px; color: var(--muted); }
.seg { display: flex; background: var(--panel-2); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 999px; padding: 10px 6px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--gold); color: #1d1606; }
.seg.team button[aria-pressed="true"] { color: #fff; }
.seg.team button[data-v="0"][aria-pressed="true"] { background: var(--home); }
.seg.team button[data-v="1"][aria-pressed="true"] { background: var(--away); }
.avpick { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 8px; }
.avpick button { background: var(--panel-2); border: 3px solid transparent; border-radius: 14px; padding: 4px; aspect-ratio: 1; }
.avpick button svg, .avpick button img { width: 100%; height: 100%; display: block; object-fit: cover; border-radius: 50%; }
.avpick button[aria-pressed="true"] { border-color: var(--gold); transform: scale(1.06); }
.av { display: inline-block; border-radius: 50%; overflow: hidden; background: #fff; flex: none; }
.av svg, .av img { width: 100%; height: 100%; display: block; object-fit: cover; }
.me { display: flex; align-items: center; gap: 12px; }
.me .nm { font-size: 24px; font-weight: 700; line-height: 1.1; }
.me .tm { font-size: 14px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.strip { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 4px 10px; background: var(--panel-2); border-radius: 14px; padding: 10px 14px; }
.strip .t { display: flex; flex-direction: column; min-width: 0; }
.strip .t.r { text-align: right; }
.strip .t b { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; white-space: normal; line-height: 1.1; }
.strip .t .sc { font-family: var(--f-display); font-size: 32px; line-height: 1; }
.strip .mid { grid-column: 1 / -1; text-align: center; color: var(--gold); font-weight: 700; font-size: 15px; line-height: 1.2; border-top: 1px solid var(--line); padding-top: 6px; }
.q { font-family: var(--f-read); font-size: 21px; line-height: 1.35; }
.tag { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
.lvl { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; background: #3b2e5a; color: #d9c9ff; }
.lvl.Pewee { background: #1f5c37; color: #c9f5d8; } .lvl.College { background: #4b3a12; color: #ffe39a; } .lvl.Pro { background: #5a1f1f; color: #ffc9c9; }
.who { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-weight: 600; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--panel-2); border: 3px solid var(--line); border-radius: 16px; padding: 12px 14px; font-size: 19px; min-height: 62px; }
.opt .k { width: 34px; height: 34px; border-radius: 50%; background: var(--night); display: grid; place-items: center; font-weight: 700; flex: none; }
.opt .av { width: 42px; height: 42px; }
.opt.mine { border-color: var(--gold); }
.opt.right { border-color: var(--good); background: #1d3f2c; }
.opt.wrong { border-color: var(--bad); background: #4a2622; }
.opt[disabled] { cursor: default; }
.opt.ro { border-color: #223c40; }
.verdict { font-family: var(--f-display); font-size: 26px; }
.verdict.good { color: var(--good); } .verdict.bad { color: var(--bad); }
.note { font-family: var(--f-read); color: var(--muted); font-size: 16px; }
.msg { font-family: var(--f-read); font-size: 20px; line-height: 1.4; }
.head { font-family: var(--f-display); font-size: 40px; line-height: 1.05; text-align: center; }
.head.good { color: var(--gold); } .head.bad { color: #ff8a7a; } .head.flag { color: var(--flag); } .head.meh { color: #cfe3dc; }
.roster { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.roster li { display: flex; align-items: center; gap: 10px; }
.roster .av { width: 30px; height: 30px; }
.roster .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.cols h3 { font-family: var(--f-ui); font-size: 14px; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 8px; }
.err { color: #ff9a8c; font-weight: 600; min-height: 1.3em; }
.pulse { animation: pulse 1s ease-in-out infinite alternate; }
@keyframes pulse { from { box-shadow: 0 0 0 0 rgba(233,185,73,.5); } to { box-shadow: 0 0 0 10px rgba(233,185,73,0); } }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { background: var(--panel-2); border-radius: 12px; padding: 10px; text-align: center; }
.stats b { display: block; font-family: var(--f-display); font-size: 26px; }
.stats span { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><h1>Gospel <span>Football</span></h1><span class="status" id="status">Not connected</span></div>

  <section class="card" id="codeScr" hidden>
    <div><span class="eyebrow">Join a game</span><h2>Enter the code</h2></div>
    <p class="note">The four letters are on the big screen next to the QR code.</p>
    <form id="codeForm" autocomplete="off" style="display:flex;flex-direction:column;gap:12px">
      <input type="text" id="codeIn" maxlength="4" placeholder="ABCD" style="text-transform:uppercase;font-family:var(--f-display);font-size:34px;letter-spacing:.3em;text-align:center" autocapitalize="characters" autocorrect="off" spellcheck="false">
      <div class="err" id="codeErr"></div>
      <button class="btn" type="submit">Join</button>
    </form>
  </section>

  <section class="card" id="signScr" hidden>
    <div><span class="eyebrow">Game <span id="signCode"></span></span><h2>Sign up to play</h2></div>
    <p class="note" id="signNote"></p>
    <form id="signForm" autocomplete="off" style="display:flex;flex-direction:column;gap:14px">
      <label class="f" for="nameIn">Your name<input type="text" id="nameIn" maxlength="24" placeholder="Type your name" required></label>
      <label class="f">Your picture</label>
      <div class="avpick" id="avPick" role="group" aria-label="Pick a picture"></div>
      <label class="f">Level</label>
      <div class="seg" id="lvlSeg" role="group" aria-label="Level">
        <button type="button" data-v="pewee" aria-pressed="true">Pewee</button>
        <button type="button" data-v="college" aria-pressed="false">College</button>
        <button type="button" data-v="pro" aria-pressed="false">Pro</button>
        <button type="button" data-v="random" aria-pressed="false">Random</button>
      </div>
      <label class="f">Team</label>
      <div class="seg team" id="teamSeg" role="group" aria-label="Team">
        <button type="button" data-v="0" aria-pressed="true">Home</button>
        <button type="button" data-v="1" aria-pressed="false">Away</button>
      </div>
      <div class="err" id="signErr"></div>
      <button class="btn" type="submit" id="joinBtn">Join the game</button>
      <button class="btn ghost" type="button" id="signCancel" hidden>Cancel</button>
    </form>
  </section>

  <section id="main" hidden style="display:flex;flex-direction:column;gap:14px">
    <div class="card" id="meCard" style="gap:10px"></div>
    <div class="card" id="view"></div>
  </section>
</div>

  if (i === "bot") return botSVG(helmet);

function offerCodeChange() {
  const s = $("#status"); if (s.querySelector("button")) return;
  const b = document.createElement("button"); b.type = "button"; b.textContent = "Try a different code"; b.className = "btn ghost"; b.style.cssText = "margin-left:8px;padding:4px 10px;font-size:14px";
  b.addEventListener("click", () => { stopped = true; clearTimeout(retryT); showOnly("codeScr"); $("#codeIn").value = code; $("#codeErr").textContent = `Check the four letters on the big screen. ${code} didn't answer.`; $("#codeIn").focus(); });
  s.appendChild(b);
}
setInterval(ensure, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) ensure(); });
setInterval(() => send({ t: "ping" }), 15000);
function onData(d) {
  if (!d || typeof d !== "object") return;
  lastMsg = Date.now();
  if (d.t === "pong") return;
  if (d.t === "hello") { hello = d; applyTeams(); if (!me) { if ($("#signScr").hidden) showSign(); else $("#signNote").textContent = signNote(); } else render(); }
  else if (d.t === "replaced") { // this player is open in a newer tab or on another phone: stop fighting over the spot
    stopped = true; clearTimeout(retryT); const c = conn; conn = null; try { c && c.close(); } catch (e) {}
    setStatus("This player is open in another tab or phone. Close this one, or reload to take over.", true);
  }
  else if (d.t === "full") { me = null; try { localStorage.removeItem(key()); } catch (e) {} state = null; showSign("The roster is full (16 players). Ask the host to make room, then sign up again."); }
  else if (d.t === "kicked") { me = null; try { localStorage.removeItem(key()); } catch (e) {} state = null; showSign("The host took you off the roster. You can sign up again."); }
  else if (d.t === "state") {
    if (d.build && d.build !== GF_BUILD) { // the big screen runs a newer page: reload once to match it
      let seen = null; try { seen = sessionStorage.getItem("gf_reloaded_for"); } catch (e) {}
      if (seen !== d.build) { try { sessionStorage.setItem("gf_reloaded_for", d.build); } catch (e) {} location.reload(); return; }
    }
    if (d.me && me) { // follow what the host set on the laptop (a drag to the other team, a fixed name), so a rejoin never undoes it
      const m = { ...me, name: d.me.name, av: d.me.av, level: d.me.level, team: d.me.team };
      if (JSON.stringify(m) !== JSON.stringify(me)) { me = m; saveMe(me); }
    }
    state = d; render();
  }
}

// ---- screens ----
function showOnly(id) { ["codeScr", "signScr", "main"].forEach(x => $("#" + x).hidden = x !== id); }
function applyTeams() { const n = (hello && hello.teams) || ["Home", "Away"]; $("#teamSeg [data-v='0']").textContent = n[0]; $("#teamSeg [data-v='1']").textContent = n[1]; }
function renderAvPick() { $("#avPick").innerHTML = AVATARS.map((a, i) => `<button type="button" data-av="${i}" aria-pressed="${form.av === i}" aria-label="${esc(a.n)}" title="${esc(a.n)}">${avatarSVG(i)}</button>`).join(""); }
function segSet(id, v) { document.querySelectorAll(`#${id} button`).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === String(v)))); }
function showSign(note) {
  editing = !!me;
  showOnly("signScr");
  $("#signCode").textContent = code;
  $("#signNote").textContent = note || signNote();
  if (me) { $("#nameIn").value = me.name; form.av = me.av; form.level = me.level; form.team = me.team; }
  else if (!form.avSet) { form.av = Math.floor(Math.random() * AVATARS.length); form.avSet = true; }
  renderAvPick(); segSet("lvlSeg", form.level); segSet("teamSeg", form.team);
  $("#joinBtn").textContent = me ? "Save" : "Join the game";
  $("#signCancel").hidden = !me;
  if (!me && !$("#nameIn").value) $("#nameIn").focus({ preventScroll: true });
}
function signNote() { return hello && hello.started ? "The game has already started. Sign up and you'll take the field at the next huddle." : "Pick a name and a picture. You can change them until kickoff."; }
$("#avPick").addEventListener("click", e => { const b = e.target.closest("[data-av]"); if (!b) return; form.av = +b.dataset.av; form.avSet = true; renderAvPick(); });
$("#lvlSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; form.level = b.dataset.v; segSet("lvlSeg", form.level); });
$("#teamSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; form.team = +b.dataset.v; segSet("teamSeg", form.team); });
$("#signCancel").addEventListener("click", () => { editing = false; if (me) { showOnly("main"); render(); } });
$("#signForm").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("#nameIn").value.trim().slice(0, 24);
  if (!name) { $("#signErr").textContent = "Type your name first."; return; }
  $("#signErr").textContent = "";
  me = { pid: (me && me.pid) || newPid(), name, av: form.av, level: form.level, team: form.team };
  saveMe(me); editing = false;
  if (stopped) { stopped = false; ensure(); }
  send({ t: "join", ...me, edit: true });
  showOnly("main"); render();
  try { navigator.vibrate && navigator.vibrate(30); } catch (x) {}
});
$("#codeForm").addEventListener("submit", e => {
  e.preventDefault();
  const c = $("#codeIn").value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
  if (!/^[ABCDEFGHJKMNPQRSTUVWXYZ]{4}$/.test(c)) { $("#codeErr").textContent = c.length !== 4 ? "The code is four letters." : "That's not a game code: it never has an I, L or O in it. Check the big screen."; return; }
  const u = new URL(location.href); u.searchParams.set("g", c); location.href = u.href;
});

// ---- the game, as seen from this phone ----
function render() {
  if (editing) return;
  showOnly("main");
  const s = state, m = (s && s.me) || me;
  const names = (s && s.teams) || (hello && hello.teams) || ["Home", "Away"];
  const teamOf = t => names[t] || (t ? "Away" : "Home");
  $("#meCard").innerHTML = `<div class="me"><span class="av" style="width:56px;height:56px;border:3px solid ${teamColor(m.team)}">${avatarSVG(m.av, teamColor(m.team))}</span><div><div class="nm">${esc(m.name)}</div><div class="tm">${esc(teamOf(m.team))} · ${LVL[m.level] || ""}</div></div></div>` +
    (s && s.score ? `<div class="strip"><div class="t"><b>${s.poss === 0 ? "\u{1F3C8} " : ""}${esc(names[0])}</b><span class="sc">${s.score[0]}</span></div><div class="t r"><b>${esc(names[1])}${s.poss === 1 ? " \u{1F3C8}" : ""}</b><span class="sc">${s.score[1]}</span></div>${s.poss != null && s.view !== "end" ? `<div class="mid">${esc(names[s.poss])} ball \u00b7 ${esc(s.down || "")} \u00b7 ${esc(s.play || "")}</div>` : ""}</div>` : "");
  const v = $("#view");
  if (!s) { v.innerHTML = `<div class="eyebrow">Game ${esc(code)}</div><p class="msg">${conn && conn.open ? "Joining…" : "Connecting to the big screen…"}</p>`; return; }
  const view = s.view;
  const buzz = (view === "question" || view === "pick" || view === "hike") && view !== lastView;
  if (view !== lastView) { sentPick = null; sentHike = false; if (view !== "question") myAns = null; }
  lastView = view;
  if (buzz) { try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch (x) {} }
  let h = "";
  if (view === "lobby") {
    const list = t => `<div><h3><span class="dot" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${teamColor(t)};margin-right:6px"></span>${esc(teamOf(t))}</h3><ul class="roster">${(s.roster || []).filter(p => p.team === t).map(p => `<li><span class="av">${avatarSVG(p.av)}</span><span>${esc(p.name)}</span>${p.phone ? `<span style="opacity:${p.on ? 1 : .4}">\u{1F4F1}</span>` : ""}</li>`).join("") || "<li class='note'>Nobody yet</li>"}</ul></div>`;
    h = `<div class="eyebrow">You're in</div><p class="msg">You're on <b>${esc(teamOf(m.team))}</b>. Waiting for the big screen to kick off.</p><div class="cols">${list(0)}${list(1)}</div><div><button class="btn ghost" type="button" id="editBtn">Change my name, picture or team</button></div>`;
  } else if (view === "pending") {
    h = `<div class="eyebrow">You're in</div><p class="msg">You'll take the field at the next huddle. Watch the big screen!</p>`;
  } else if (view === "question" || view === "watch") {
    const q = s.q, a = s.answered, mineQ = view === "question";
    const who = q.crew ? `Team question for ${esc(teamOf(q.team))}` : `${esc(q.who)}'s question`;
    h = `<div class="who"><span class="av" style="width:40px;height:40px;border:3px solid ${teamColor(q.team)}">${avatarSVG(q.av, teamColor(q.team))}</span><span>${who}</span><span class="lvl ${esc(q.level)}">${esc(q.level)}</span><span class="tag">${esc(q.cat)}</span></div>
      <div class="note">${mineQ ? (q.crew ? "Everyone on your team votes. Majority wins." : "It's your turn! Answer on your phone.") : `${esc(q.who)} is on ${esc(q.side)}. Question ${q.n} of ${q.of} in this huddle.`}</div>
      <div class="q">${esc(q.text)}</div>`;
    const voteNote = mineQ && s.vote ? `<div class="note">${s.vote.mine != null ? `Your vote: <b>${esc(s.vote.mine)}</b>. ` : ""}${s.vote.got} of ${s.vote.need} on your team have voted.</div>` : "";
    const canTap = mineQ && !a;
    h += `<div class="opts">${(q.options || []).map((o, i) => { let cls = ""; const chosen = a ? a.opt : (mineQ ? (s.vote ? s.vote.mine : myAns) : null); if (a) { if (o === a.answer) cls = "right"; else if (o === a.opt) cls = "wrong"; } else if (o === chosen) cls = "mine"; return `<button type="button" class="opt ${cls}${mineQ ? "" : " ro"}" data-o="${i}" ${canTap ? "" : "disabled"}><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`; }).join("")}</div>${a ? "" : voteNote}`;
    if (a) h += `<div class="verdict ${a.ok ? "good" : "bad"}">${a.ok ? `Correct! ${esc(q.crew ? teamOf(q.team) : q.who)} ${q.crew ? "take" : "takes"} the field.` : `Not quite. ${esc(q.crew ? teamOf(q.team) : q.who)} ${q.crew ? "sit" : "sits"} this one out.`}</div><div class="note">Answer: <b>${esc(a.answer)}</b>.${a.note ? ` ${esc(a.note)}` : ""}</div>`;
    else if (!mineQ) h += `<div class="note">${q.bot ? "The computer is thinking…" : `${esc(q.who)} is picking${q.crew ? "" : " on the big screen or their phone"}…`}</div>`;
  } else if (view === "pick") {
    h = `<div class="eyebrow">${s.kind === "target" ? "Quarterback" : "Defensive captain"}</div><p class="msg">${esc(s.msg)}</p>
      <div class="opts">${s.cands.map(c => `<button type="button" class="opt ${sentPick === c.id ? "mine" : ""}" data-pick="${c.id}" ${sentPick != null ? "disabled" : ""}><span class="av">${avatarSVG(c.av, teamColor(s.kind === "target" ? s.poss : 1 - s.poss))}</span><span>${esc(c.name)}</span></button>`).join("")}</div>
      ${sentPick != null ? `<div class="note">Sent to the big screen.</div>` : ""}`;
  } else if (view === "hike") {
    h = `<div class="eyebrow">Offense</div><p class="msg">${esc(s.msg)}</p><button class="btn big pulse" type="button" id="hikeBtn" ${sentHike ? "disabled" : ""}>${sentHike ? "Hiked!" : "Hike!"}</button>`;
  } else if (view === "result") {
    h = `<div class="head ${esc(s.kind || "meh")}">${esc(s.head || "")}</div><p class="msg">${esc(s.msg || "")}</p>`;
  } else if (view === "end") {
    const st = s.st || {};
    h = `<div class="eyebrow">Final</div><div class="head good">${esc(s.final)}</div>
      <div class="stats"><div><b>${st.right || 0}/${st.asked || 0}</b><span>Correct</span></div><div><b>${st.yds || 0}</b><span>Yards</span></div><div><b>${st.tds || 0}</b><span>TDs</span></div><div><b>${st.stops || 0}</b><span>Stops</span></div><div><b>${st.ints || 0}</b><span>Picks</span></div></div>
      <p class="note">Stay on this page for the rematch.</p>`;
  } else {
    h = `<div class="eyebrow">${esc(s.play || "")}</div><p class="msg">${esc(s.msg || "Waiting for the big screen…")}</p>`;
  }
  v.innerHTML = h;
  v.querySelectorAll(".opt[data-o]:not([disabled])").forEach(b => b.addEventListener("click", () => { const o = s.q.options[+b.dataset.o]; if (send({ t: "answer", opt: o })) { myAns = o; render(); } }));
  v.querySelectorAll(".opt[data-pick]").forEach(b => b.addEventListener("click", () => { const id = +b.dataset.pick; if (send({ t: "pick", id })) { sentPick = id; render(); } }));
  const hb = $("#hikeBtn"); if (hb) hb.addEventListener("click", () => { if (send({ t: "hike" })) { sentHike = true; render(); } });
  const eb = $("#editBtn"); if (eb) eb.addEventListener("click", () => showSign());
}

// ---- boot ----
if (!code) { showOnly("codeScr"); $("#codeIn").focus(); }
else {
  me = loadMe();
  if (me) { showOnly("main"); render(); } else { showSign(); }
  if (typeof Peer === "undefined") setStatus("The connection library didn't load. Check your internet and reload.", true);
  else connect();
}
})();
</script>
</body>
</html>
